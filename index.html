
<!DOCTYPE html>
<html lang="en" >

<head>
  <meta charset="UTF-8">
  
  
  

  <title>RubberBandText Editor : WIP</title>

    <link rel="canonical" href="https://codepen.io/vpelss/pen/jOdOMLe">
  
  
  
  
<style>
#blockeditor {
  white-space: nowrap;
  border-style: solid;
  border-width: 1pt;
  resize: both;
  overflow: auto;
}

.cell {
  display: inline;
  user-select: none;
  -webkit-user-select: none; /* Safari */
}

.mark {
  background-color: yellow;
}
</style>

  
  
  
</head>

<body>
  <h4>This simple JavaScript text editor allows you to mark multiple rectangular blocks of text and delete them.</h4>

<p>Notepad editor: Paste your original text here.</p>
<textarea id="notepad" placeholder="paste troublesome text here" cols="100" rows="5" wrap="off">
Example Example Example Example Example Example Example 
Example Example Example Example Example Example Example 
Example Example RemoveMe Example Example Example Example 
Example Example RemoveMe Example Example Example Example
Example Example RemoveMe Example Example Example Example
Example Example Example Example Example Example Example 
Example Example Example Example Example Example Example 
</textarea>

<p>Block/Mark and Delete editor only. Click and drag over the text to highlight the text you want to delete. Then push 'Delete' key to delete.</p>
<div id="blockeditor"></div>
  
    <script id="rendered-js" >
//This simple text editor alows you to mark multiple rectangular blocks of text and delete them

var lines = []; //textarea
var mousestate = "";
var startpos = "";
var endpos = ""; //not really used

let notepad = document.getElementById("notepad");
let blockeditor = document.getElementById("blockeditor");
notepad.style.width = "100%";

document.body.onkeydown = OnKeyPress;
blockeditor.onmouseleave = OnMouseUp;

//any change to notepad will trigger BuildBlockEditor
notepad.oninput = NotepadUpdated; 
NotepadUpdated();
function NotepadUpdated() {
  BuildBlockEditor();
}

function BuildBlockEditor() { 
  let div_text = "";
  lines = notepad.value.split(/\r?\n/); //split lines
  lines.forEach(function (line, y) {
    let letter_array = line.split(""); //split all
    letter_array.forEach(function (letter, x) {
      let id = "cell_" + x + "_" + y;
      let EOnMouseDown = "onmousedown='OnMouseDown(this);' ";
      let EOnMouseMove = "onmousemove='OnMouseMove(this);' ";
      let EOnMouseUp = "onmouseup='OnMouseUp(this);' ";
      div_text =
        div_text +
        "<DIV class='cell' id='" +
        id +
        "' " +
        EOnMouseDown +
        EOnMouseMove +
        EOnMouseUp +
        ">" +
        letter +
        "</div>";
    });
    div_text = div_text + "</br>";
  });
  blockeditor.innerHTML = div_text;
  MatchSize();  //match edit box sizes
}

function OnMouseDown(el) {
  mousestate = "onmousedown";
  startpos = el.id;
  el.classList.add("mark");
}

function OnMouseMove(el) {//each time the mouse moves
  let start_x, start_y, end_x, end_y;
  if (mousestate == "onmousedown") { //if the mouse is in a 'mousedown' state
    
     [start_x, start_y] = startpos.replace("cell_", "").split("_"); //get x,y start position
    [end_x, end_y] = el.id.replace("cell_", "").split("_"); //get current x,y end position
    //our code always works right to left and top to bottom
    //so switch start and end values if start values are greater than end values
    if (start_x > end_x) {
      [start_x, end_x] = [end_x, start_x];
    }
    if (start_y > end_y) {
      [start_y, end_y] = [end_y, start_y];
    }
    //set the class as 'mark' for all letters in the square from startpos to el.id 
    for (let y = start_y; y <= end_y; y++) {
      for (let x = start_x; x <= end_x; x++) {
        let textID = "cell_" + x + "_" + y;
        if (document.getElementById(textID)) {
          //element exists
          document.getElementById(textID).classList.add("mark");
        }
      }
    }
  }
}

function OnMouseUp(el) {
  mousestate = "onmouseup";
  endpos = el.id;
}

function OnKeyPress() {
  let new_text = "";
  let key = event.key;
  var activeElement = document.activeElement;
  if (activeElement != notepad) {
    //allows us to edit original text box
    if (key == "Backspace" || key == "Delete") {
      //because Apple is stupid
      lines.forEach(function (line, y) {
        //check each letter and only rebuild with unmarked text
        let letter_array = line.split(""); //split into letters
        letter_array.forEach(function (letter, x) {
          let el = document.getElementById("cell_" + x + "_" + y);
          if (!el.classList.contains("mark")) {
            new_text = new_text + letter;
          }
        });
        new_text = new_text + "\r\n";
      });
      notepad.value = new_text;
      NotepadUpdated(); //oninput does not work programmatically???
    }
  }
}

function MatchSize(){
   //match edit box sizes
  blockeditor.style.width = "" + notepad.clientWidth + "px";
  blockeditor.style.height = "" + notepad.clientHeight + "px";
}

const resize_ob = new ResizeObserver(function(entries) {
  MatchSize();
});

// start observing for resize
resize_ob.observe(document.querySelector("#notepad"));
  </script>

  
</body>

</html>
